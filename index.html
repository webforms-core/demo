<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebForms Core Demo</title>

    <script type="module" src="/demo/script/web-forms.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f6f4;
            color: #372b1f;
        }

        header {
            margin-left: 240px;
            padding: 55px 40px;
            background: linear-gradient(135deg, #865a22, #e5bba7);
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 38px;
        }

        header p {
            margin: 0;
            font-size: 17px;
            opacity: 0.8;
        }

        nav {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            padding: 35px 20px;
            background: #75522c;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            z-index: 1000;
        }

        nav .logo {
            margin-bottom: 35px;
            padding: 0 12px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            padding: 12px 14px;
            color: #e1d5cb;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        nav a:hover {
            background: #977b50;
            color: white;
        }

        .menu-toggle {
            display: none;
        }

        .menu-button,
        .menu-close {
            display: none;
        }

        main {
            width: min(1000px, calc(100% - 80px));
            min-height: 420px;
            margin: 40px auto;
            margin-left: calc(240px + 40px);
            padding: 40px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        footer {
            margin-left: 240px;
            padding: 30px 20px;
            text-align: center;
            color: #80756b;
            font-size: 14px;
        }

        img {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        @media (max-width: 700px) {

            .menu-button {
                display: flex;
                position: fixed;
                top: 15px;
                left: 15px;
                width: 46px;
                height: 46px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                background: #75522c;
                color: white;
                font-size: 27px;
                cursor: pointer;
                z-index: 900;
                box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            }

            nav {
                width: 260px;
                max-width: 85%;
                height: 100vh;
                padding: 25px 20px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 5px 0 20px rgba(0, 0, 0, 0.2);
            }

            .menu-toggle:checked ~ nav {
                transform: translateX(0);
            }

            nav .logo {
                margin: 5px 45px 25px 0;
            }

            .menu-close {
                display: flex;
                position: absolute;
                top: 18px;
                right: 15px;
                width: 40px;
                height: 40px;
                align-items: center;
                justify-content: center;
                border: none;
                background: transparent;
                color: white;
                font-size: 30px;
                cursor: pointer;
            }

            header,
            footer {
                margin-left: 0;
            }

            header {
                padding: 80px 20px 40px;
            }

            header h1 {
                font-size: 30px;
            }

            main {
                width: calc(100% - 24px);
                margin: 24px auto;
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">

    <label for="menu-toggle" class="menu-button">☰</label>

    <nav>
        <label for="menu-toggle" class="menu-close">×</label>

        <div class="logo">Demo Examples</div>

        <a href="#main">Main Page</a>
        <a href="#chart">Chart</a>
        <a href="#custom_event">Custom Event</a>
        <a href="#set_format">Set Format</a>
        <a href="#drag_and_drop">Drag and Drop</a>
        <a href="#render">Render</a>
        <a href="#memory_tiles_game">Memory Tiles Game</a>
        <a href="#about">About Demo</a>
    </nav>

    <header>
        <h1>WebForms Core (WFC)</h1>
        <p>Server-Orchestrated UI for the Web</p>
    </header>

    <main>
        <!-- Content is managed by WebForms Core -->
    </main>

    <footer>
        WebForms Core Technology - Open Source
    </footer>

    <script type="module">
        FrontBack(null, "/demo/script/module/only-front/root.js");
    </script>

</body>
</html>
