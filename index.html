```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebForms Core Demo</title>

    <script type="module" src="/demo/script/web-forms.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            padding: 70px 20px 60px;
            text-align: center;
            background: linear-gradient(135deg, #111827, #263449);
            color: white;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 42px;
            letter-spacing: -1px;
        }

        header p {
            margin: 0;
            font-size: 18px;
            opacity: 0.8;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            padding: 9px 16px;
            color: #374151;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        nav a:hover {
            background: #f1f5f9;
            color: #111827;
        }

        main {
            width: min(1000px, calc(100% - 40px));
            min-height: 420px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        footer a {
            color: #374151;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            header {
                padding: 50px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            main {
                width: calc(100% - 24px);
                margin: 24px auto;
                padding: 24px;
            }

            nav {
                gap: 2px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>WebForms Core</h1>
        <p>Server-Orchestrated UI for the Web</p>
    </header>

    <nav>
        <a href="#main">Main Page</a>
        <a href="#about">About</a>
        <a href="#license">License</a>
    </nav>

    <main id="main">
        <!-- Content is managed by WebForms Core -->
    </main>

    <footer>
        WebForms Core · Open Source
    </footer>

    <script type="module">
        FrontBack(null, "/demo/script/module/only-front/root.js");
    </script>

</body>
</html>
