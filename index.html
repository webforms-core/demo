<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebForms Core Demo</title>

    <script type="module" src="/demo/script/web-forms.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            margin-left: 240px;
            padding: 55px 40px;
            background: linear-gradient(135deg, #865a22, #e5bba7);
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 38px;
        }

        header p {
            margin: 0;
            font-size: 17px;
            opacity: 0.8;
        }

        nav {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            padding: 35px 20px;
            background: #75522c;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        nav .logo {
            margin-bottom: 35px;
            padding: 0 12px;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            padding: 12px 14px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        nav a:hover {
            background: #977b50;
            color: white;
        }

        main {
            width: min(1000px, calc(100% - 80px));
            min-height: 420px;
            margin: 40px auto;
            margin-left: calc(240px + 40px);
            padding: 40px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        footer {
            margin-left: 240px;
            padding: 30px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        img {
            max-width:100%;
            height:auto;
            margin:0 auto;
            display:block;
        }

        @media (max-width: 700px) {
            nav {
                position: static;
                width: 100%;
                height: auto;
                padding: 15px;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
            }

            nav .logo {
                margin: 0 15px 0 0;
                white-space: nowrap;
            }

            nav a {
                white-space: nowrap;
            }

            header,
            footer {
                margin-left: 0;
            }

            header {
                padding: 40px 20px;
            }

            main {
                width: calc(100% - 24px);
                margin: 24px auto;
                padding: 24px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Demo Examples</div>
        <a href="#main">Main Page</a>
        <a href="#chart">Chart</a>
        <a href="#memory_tiles_game">Memory Tiles Game</a>
        <a href="#about">About Demo</a>
    </nav>

    <header>
        <h1>WebForms Core (WFC)</h1>
        <p>Server-Orchestrated UI for the Web</p>
    </header>

    <main>
        <!-- Content is managed by WebForms Core -->
    </main>

    <footer>
        WebForms Core Technology - Open Source
    </footer>

    <script type="module">
        FrontBack(null, "/demo/script/module/only-front/root.js");
    </script>

</body>
</html>
